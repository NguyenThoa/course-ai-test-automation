# Base URL of the application under test
base.url=https://crm.anhtester.com

# Valid credentials used by the happy-path login test
valid.email=admin@example.com
valid.password=123456

# Browser to run the tests on: chrome | firefox | edge
browser=chrome

# Run the browser without a visible UI (true/false)
headless=false

# Explicit wait timeout (seconds) used by WebDriverWait across all pages
explicit.wait.seconds=10
